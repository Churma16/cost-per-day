name: Trigger QA Deployment

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: trigger-worthwhile-qa
  cancel-in-progress: false

jobs:
  dispatch:
    name: Dispatch main commit to QA
    runs-on: ubuntu-24.04

    steps:
      - name: Trigger deployment repository QA workflow
        shell: bash
        env:
          QA_DEPLOY_TOKEN: ${{ secrets.QA_DEPLOY_TOKEN }}
          APP_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [ -z "$QA_DEPLOY_TOKEN" ]; then
            echo "QA_DEPLOY_TOKEN is required to dispatch the QA deployment workflow."
            exit 1
          fi

          payload="$(jq -nc --arg app_ref "$APP_SHA" '{ref:"main",inputs:{app_ref:$app_ref}}')"

          curl --fail-with-body --silent --show-error --location \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $QA_DEPLOY_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/Churma16/cost-per-day-deployment/actions/workflows/deploy-qa.yml/dispatches \
            --data "$payload"

          echo "Dispatched QA deployment for application commit $APP_SHA."
