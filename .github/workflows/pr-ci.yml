name: PR CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: pr-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25.5"
          cache-dependency-path: backend/go.sum

      - name: Run backend tests
        working-directory: backend
        run: |
          go mod tidy
          git diff -- go.mod go.sum
          go test -count=1 ./...

  frontend:
    name: Frontend test and build
    runs-on: ubuntu-latest

    env:
      CI: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build production bundle
        run: npm run build

  production-smoke:
    name: Production container smoke
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build production container
        run: docker build -t cost-per-day:pr .

      - name: Smoke test production container
        shell: bash
        run: |
          set -euo pipefail

          data_dir="${{ runner.temp }}/cost-per-day-data"
          backup_dir="${{ runner.temp }}/cost-per-day-backups"
          mkdir -p "$data_dir" "$backup_dir"

          prepare_data_owner() {
            docker run --rm \
              -v "$data_dir:/data" \
              alpine:3.22 \
              chown -R 10001:10001 /data
          }

          cleanup() {
            docker rm -f cost-per-day-smoke >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          start_app() {
            cleanup
            docker run -d \
              --name cost-per-day-smoke \
              -p 127.0.0.1:18080:8080 \
              -v "$data_dir:/var/lib/cost-per-day" \
              -e GOOGLE_CLIENT_ID=ci-client-id \
              -e GOOGLE_CLIENT_SECRET=ci-client-secret \
              -e SESSION_SECRET=ci-session-secret-that-is-at-least-32-characters \
              -e APP_BASE_URL=http://127.0.0.1:18080 \
              cost-per-day:pr >/dev/null

            for attempt in $(seq 1 20); do
              if curl --fail --silent http://127.0.0.1:18080/health >/dev/null; then
                return 0
              fi
              sleep 1
            done

            docker logs cost-per-day-smoke
            return 1
          }

          prepare_data_owner
          start_app

          curl --fail --silent http://127.0.0.1:18080/ \
            | grep --fixed-strings '<div id="root"></div>'

          unauthenticated_status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
            http://127.0.0.1:18080/api/items)"
          test "$unauthenticated_status" = "401"

          cleanup

          session_token="ci-smoke-session-token"
          session_hash="$(printf '%s' "$session_token" | sha256sum | cut -d' ' -f1)"

          docker run --rm \
            -e SESSION_HASH="$session_hash" \
            -v "$data_dir:/data" \
            alpine:3.22 \
            sh -ec 'apk add --no-cache sqlite >/dev/null; \
              sqlite3 /data/cost-per-day.db "INSERT OR IGNORE INTO users (id, created_at, updated_at) VALUES ('"'"'ci-user'"'"', strftime('"'"'%Y-%m-%dT%H:%M:%fZ'"'"','"'"'now'"'"'), strftime('"'"'%Y-%m-%dT%H:%M:%fZ'"'"','"'"'now'"'"'));"; \
              sqlite3 /data/cost-per-day.db "INSERT OR REPLACE INTO auth_sessions (token_hash, user_id, created_at, expires_at) VALUES ('"'"'$SESSION_HASH'"'"', '"'"'ci-user'"'"', strftime('"'"'%Y-%m-%dT%H:%M:%fZ'"'"','"'"'now'"'"'), strftime('"'"'%Y-%m-%dT%H:%M:%fZ'"'"','"'"'now'"'"','"'"'+30 days'"'"'));"'

          prepare_data_owner
          start_app

          curl --fail --silent \
            --cookie "cost_per_day_session=$session_token" \
            -H 'Content-Type: application/json' \
            -d '{"name":"CI persistence item","price":123.45,"purchaseDate":"2026-09-22T00:00:00Z"}' \
            http://127.0.0.1:18080/api/items \
            | grep --fixed-strings 'CI persistence item'

          docker run --rm \
            -v "$data_dir:/data" \
            -v "$backup_dir:/backup" \
            alpine:3.22 \
            sh -ec 'apk add --no-cache sqlite >/dev/null; sqlite3 /data/cost-per-day.db ".backup /backup/smoke.db"; test "$(sqlite3 /backup/smoke.db "PRAGMA integrity_check;")" = "ok"'

          cleanup
          start_app

          curl --fail --silent \
            --cookie "cost_per_day_session=$session_token" \
            http://127.0.0.1:18080/api/items \
            | grep --fixed-strings 'CI persistence item'

          cleanup
          docker run --rm \
            -v "$data_dir:/data" \
            -v "$backup_dir:/backup:ro" \
            alpine:3.22 \
            sh -ec 'rm -f /data/cost-per-day.db /data/cost-per-day.db-wal /data/cost-per-day.db-shm; cp /backup/smoke.db /data/cost-per-day.db; chown -R 10001:10001 /data'

          start_app

          curl --fail --silent \
            --cookie "cost_per_day_session=$session_token" \
            http://127.0.0.1:18080/api/items \
            | grep --fixed-strings 'CI persistence item'
