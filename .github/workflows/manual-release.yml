name: Manual Release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release type (auto determines from conventional commits)'
        required: false
        default: 'auto'
        type: choice
        options:
          - 'auto'
          - 'patch'
          - 'minor'
          - 'major'
      release_channel:
        description: 'Release channel (beta by default while Worthwhile is in Early Beta)'
        required: true
        default: 'beta'
        type: choice
        options:
          - 'beta'
          - 'stable'
      dry_run:
        description: 'Dry run (simulate version bump and release notes without pushing tags/releases)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: read

jobs:
  release:
    name: Official release
    runs-on: ubuntu-latest
    steps:
      - name: Validate release branch
        run: |
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "[ERROR] Official releases can only be published from the 'main' branch (current ref: ${{ github.ref }})."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configure Git user
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump version and update changelog
        id: bump
        env:
          RELEASE_TYPE: ${{ inputs.release_type }}
          RELEASE_CHANNEL: ${{ inputs.release_channel }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          EXTRA_ARGS=""
          if [ "$RELEASE_TYPE" != "auto" ]; then
            EXTRA_ARGS="--release-as $RELEASE_TYPE"
          fi
          if [ "$RELEASE_CHANNEL" = "beta" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --prerelease beta"
          fi

          if [ "$DRY_RUN" = "true" ]; then
            echo "[INFO] Running simulated version bump and changelog generation (dry-run)"
            npx -y commit-and-tag-version@13.2.1 $EXTRA_ARGS --skip.commit --skip.tag
          else
            echo "[INFO] Running official release bump"
            npx -y commit-and-tag-version@13.2.1 $EXTRA_ARGS
          fi

          GENERATED_VERSION=$(node -p "require('./package.json').version")
          GENERATED_TAG="v${GENERATED_VERSION}"

          if [ "$RELEASE_CHANNEL" = "beta" ]; then
            case "$GENERATED_VERSION" in
              *-beta.*)
                echo "RELEASE_IS_PRERELEASE=true" >> "$GITHUB_ENV"
                ;;
              *)
                echo "[ERROR] Beta release produced non-beta version: $GENERATED_VERSION"
                exit 1
                ;;
            esac
          else
            case "$GENERATED_VERSION" in
              *-*)
                echo "[ERROR] Stable release produced prerelease version: $GENERATED_VERSION"
                exit 1
                ;;
              *)
                echo "RELEASE_IS_PRERELEASE=false" >> "$GITHUB_ENV"
                ;;
            esac
          fi

          if [ "$DRY_RUN" != "true" ]; then
            git rev-parse --verify "refs/tags/$GENERATED_TAG" >/dev/null
          fi

          echo "RELEASE_TAG=$GENERATED_TAG" >> "$GITHUB_ENV"
          echo "[INFO] Generated release tag: $GENERATED_TAG"

      - name: Generate release notes
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ env.RELEASE_TAG }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          IS_DRY_RUN: ${{ inputs.dry_run }}
        run: node .github/scripts/generate-release-notes.mjs

      - name: Display release notes preview
        if: ${{ inputs.dry_run == true }}
        run: |
          echo "### Dry-Run Release Notes Preview (${{ env.RELEASE_TAG }})" >> "$GITHUB_STEP_SUMMARY"
          cat release-notes.md >> "$GITHUB_STEP_SUMMARY"

      - name: Restore workspace state after dry run
        if: ${{ inputs.dry_run == true }}
        run: |
          echo "[INFO] Restoring workspace state after dry run"
          git checkout -- .
          git clean -fd
          rm -f release-notes.md

      - name: Push version bump and tag
        if: ${{ inputs.dry_run == false }}
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}"
          BRANCH=${{ github.ref_name }}
          git push origin "$BRANCH" --follow-tags

      - name: Publish GitHub release
        if: ${{ inputs.dry_run == false }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          body_path: release-notes.md
          prerelease: ${{ env.RELEASE_IS_PRERELEASE == 'true' }}
